
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern responsive calculator built with HTML, CSS and JavaScript.">
    <title>Calculator | OIBSIP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app-container">
        <header class="header">
            <div class="brand">
                <div class="brand-icon">C</div>
                <div>
                    <h1>Calculator</h1>
                    <p>Simple. Fast. Accurate.</p>
                </div>
            </div>
            <span class="version">WEB APP</span>
        </header>

        <section class="calculator">
            <div class="display" aria-live="polite">
                <div id="expression" class="expression">Ready to calculate</div>
                <div id="result" class="result">0</div>
            </div>

            <div class="keypad" id="keypad">
                <button class="key utility" data-action="clear">C</button>
                <button class="key utility" data-action="backspace">⌫</button>
                <button class="key operator" data-value="%">%</button>
                <button class="key operator" data-value="/">÷</button>

                <button class="key" data-value="7">7</button>
                <button class="key" data-value="8">8</button>
                <button class="key" data-value="9">9</button>
                <button class="key operator" data-value="*">×</button>

                <button class="key" data-value="4">4</button>
                <button class="key" data-value="5">5</button>
                <button class="key" data-value="6">6</button>
                <button class="key operator" data-value="-">−</button>

                <button class="key" data-value="1">1</button>
                <button class="key" data-value="2">2</button>
                <button class="key" data-value="3">3</button>
                <button class="key operator" data-value="+">+</button>

                <button class="key utility" data-action="sign">+/−</button>
                <button class="key" data-value="0">0</button>
                <button class="key" data-value=".">.</button>
                <button class="key equals" data-action="calculate">=</button>
            </div>
        </section>

        <footer class="footer">
            <p>Built with HTML, CSS & Vanilla JavaScript</p>
            <span>Oasis Infobyte Internship · Level 2</span>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
